<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>


</head>
<body>

    <!-- spinners    -->
     <div class="spinner-border text-danger text-decoration-underline spinner-border-sm h-25 w-25"><img src="image.jpg" class="w-25 h-25" alt=""></div>
     <div class="spinner-border text-danger text-decoration-underline spinner-border-md"></div>
     <div class="spinner-border text-danger text-decoration-underline spinner-border-lg"></div>

     <div class="spinner-grow text-danger text-decoration-underline spinner-grow-sm h-25 w-25"><img src="image.jpg" class="w-25 h-25" alt=""></div>
     <div class="spinner-grow text-danger text-decoration-underline spinner-grow-md"></div>
     <div class="spinner-grow text-danger text-decoration-underline spinner-grow-lg"></div>

     <button class="btn btn-success">
     <span class="spinner-grow text-danger text-decoration-underline spinner-grow-sm h-25 w-25"><img src="image.jpg" class="w-25 h-25" alt=""></span>
     </button>

     <button class="btn btn-success">
     <span class="spinner-border text-danger  spinner-border-sm h-25 w-25"><img src="image.jpg" class="w-25 h-25" alt=""></span>
     </button>


</body>
</html>
